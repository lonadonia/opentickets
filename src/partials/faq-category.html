<li class="col-md-6 col-xl-4 ot-faq-item ot-reveal">
  <a class="ot-faq-card hover-scale" href="{{ href }}">
    <span class="ot-faq-card__main">
      <span class="ot-faq-card__icon"><svg class="ot-icon" aria-hidden="true"><use href="#i-{{ icon }}"></use></svg></span>
      <span class="ot-faq-card__title">{{ title }}</span>
      <span class="ot-faq-card__cta" aria-hidden="true">View answers<svg class="ot-icon"><use href="#i-arrow-right"></use></svg></span>
    </span>
    <span class="ot-faq-card__stub">
      <span class="ot-faq-card__count"><span class="ot-faq-card__num">{{ count }}</span> <span class="ot-faq-card__unit">{{ unitLabel }}</span></span>
    </span>
  </a>
</li>
