<li class="col-sm-6 col-xl-4">
  <a class="ot-faq-card hover-scale" href="{{ href }}">
    <span class="ot-faq-card__icon"><svg class="ot-icon" aria-hidden="true"><use href="#i-{{ icon }}"></use></svg></span>
    <span class="ot-faq-card__body">
      <span class="ot-faq-card__title">{{ title }}</span>
      <span class="ot-faq-card__count">{{ countLabel }}</span>
    </span>
    <svg class="ot-icon ot-faq-card__arrow" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
  </a>
</li>
