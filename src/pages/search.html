{{> layout-start }}

    <div class="ot-container">
      <nav class="ot-breadcrumb" aria-label="Breadcrumb">
        <ol>
          <li><a href="{{ routes.home }}">Events</a></li>
          <li aria-current="page">Search</li>
        </ol>
      </nav>

      <!-- SEARCH HEADER — GET {{ routes.search }}?q= (same contract as the topbar search) -->
      <section class="ot-search-head" aria-labelledby="search-heading">
        <h1 class="ot-page-hero__title" id="search-heading">
          <span data-ot-search-title-all>All events</span>
          <span data-ot-search-title-query hidden>Results for “<span data-ot-query></span>”</span>
        </h1>
        <p class="ot-section__meta" data-ot-search-count
           data-label-one="1 event found" data-label-many="{n} events found" data-label-all="{n} upcoming events"
           aria-live="polite">{{ eventCount }} upcoming events</p>
        <form class="ot-search-form" action="{{ routes.search }}" method="GET" role="search">
          <label class="visually-hidden" for="search-page-input">Search events or venues</label>
          <svg class="ot-icon ot-search-form__icon" aria-hidden="true"><use href="#i-search"></use></svg>
          <input class="form-control" type="text" name="q" id="search-page-input" value="{{ query }}" placeholder="Search events or venues…" autocomplete="off">
          <button class="btn ot-btn ot-btn--primary" type="submit">Search</button>
        </form>
      </section>

      <!--
        RESULTS — same event-card partial as the home page.
        Static preview only: data-ot-demo-search lets ot-search-preview.js filter these cards by ?q=.
        In the live theme the server renders the matching cards; remove the attribute and the script.
      -->
      <section class="ot-section ot-search-results" aria-labelledby="search-results-heading">
        <h2 class="visually-hidden" id="search-results-heading">Matching events</h2>
        <div class="row" id="search-results" data-ot-demo-search>
{{{ cards }}}
        </div>

        <div class="ot-empty" data-ot-search-empty hidden>
          <span class="ot-empty__icon"><svg class="ot-icon" aria-hidden="true"><use href="#i-search-x"></use></svg></span>
          <h2 class="ot-empty__title">No events found for “<span data-ot-query></span>”</h2>
          <p class="ot-empty__text">Check the spelling, or try a team, artist or venue name.</p>
          <a class="btn ot-btn ot-btn--ghost" href="{{ routes.home }}">Browse all events</a>
        </div>
      </section>
    </div>

{{> layout-end }}
